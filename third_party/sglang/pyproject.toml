[project]
name = "sglang-speedup-nvidia"
version = "0.5.18"
description = "SGLang v0.5.18 fork for H20/H800 speculative decoding optimization"
requires-python = ">=3.12"
dependencies = []

[tool.uv]
# The interactive venv lives at <root>/.venv (uv-managed). Declaring this
# project root lets uv/pi-lens resolve the project interpreter so the Python
# LSP and type checkers can see sglang's third-party deps instead of falling
# back to the system python.
package = false

[tool.ruff]
# This tree is a fork of sgl-project/sglang and deliberately keeps upstream's
# source style verbatim: typing modernization (PEP 585/604) is applied upstream
# file-by-file, so a tree-wide rewrite would create diff noise against the
# baseline tag (v0.5.18) that every performance comparison is anchored to.
# Keep the linter from rewriting those untouched upstream files.
target-version = "py39"

[tool.ruff.lint]
ignore = [
    "UP006", # List/dict/set -> list/dict/set
    "UP007", # Optional[X]/Union[X, Y] -> X | Y
    "UP035", # deprecated typing imports (typing.List, typing.Callable, ...)
    "I001",  # import block sorting
    "E501",  # line length
]

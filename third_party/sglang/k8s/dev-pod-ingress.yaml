# dev-pod 的 Ingress 入口 —— 替代 kubectl port-forward 的长期方案
#
# 前置: 集群必须有 Ingress 控制器，先确认:
#   kubectl get ingressclass        # 有输出（如 nginx / alb）才继续
#   kubectl get pods -A | grep -iE 'ingress|nginx|alb|gateway'
#   全空 => 集群没有 Ingress 控制器，用文件末尾的 NodePort 备选
#
# 用法（class 已填 nginx，与 bio-prod 生产 Ingress 同控制器）:
#   1) 先加 DNS 记录（你管理的 yanhuang.ai4s.com.cn 解析设置里）:
#        记录类型 CNAME  主机记录 dev-cs-9f2k  记录值 = 生产域名的现有目标
#        （即 dig +short yanhuang.ai4s.com.cn 的结果，通常是 nlb-*.aliyuncsslb.com）
#      生效后完整域名为 dev-cs-9f2k.yanhuang.ai4s.com.cn
#   2) kubectl apply -f k8s/dev-pod-ingress.yaml
#   3) kubectl get ingress dev-pod        # ADDRESS 应显示生产同款 NLB 地址
#   4) 浏览器打开 http://dev-cs-9f2k.yanhuang.ai4s.com.cn/   （密码 sglang-dev-2026）
#   5) 删除: kubectl delete -f k8s/dev-pod-ingress.yaml（DNS 记录可留可删）
#
#   注: 生产 Ingress 是精确 host 匹配 yanhuang.ai4s.com.cn（非后缀匹配），
#   本子域名路由与生产完全隔离。
#
# 安全设计:
#   - 精确 host 匹配（无 catch-all）: 其他任意 Host 打 NLB 全部 404，
#     生产 yanhuang.ai4s.com.cn 路由完全不受影响
#   - 子域名带随机尾巴，不易被扫描器猜到
#   - 可选 IP 白名单（下方 whitelist-source-range 注解，取消注释并填你的出口 IP）
#   - code-server 密码登录（建议 Pod 重建时把 CS_PASSWORD 换成强密码）
#
# 注意:
#   - 这会通过集群入口（LB）暴露 code-server，登录密码就是唯一防线，
#     用完后建议删掉 Ingress
#   - WebSocket（VS Code 终端/插件）nginx/ALB 均原生支持，无需额外配置
apiVersion: v1
kind: Service
metadata:
  name: dev-pod
  namespace: bio-prod
  labels:
    app: dev-pod
spec:
  selector:
    app: dev-pod
  ports:
    - name: code-server
      port: 8080
      targetPort: 8080
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: dev-pod
  namespace: bio-prod
  labels:
    app: dev-pod
  annotations:
    # nginx Ingress: code-server 的 WebSocket/终端长连接，防 60s 默认超时断流
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    # 【推荐启用】IP 白名单: 只放行你的出口 IP，其余来源直接 403
    #   查你的出口 IP: 在 Mac 上执行  curl ifconfig.me
    #   多个 IP/网段用英文逗号分隔，如 "203.0.113.7/32,198.51.100.0/24"
    #   注意: 走 VPN 时出口 IP 会变，按 VPN 出口填或保持注释
    # nginx.ingress.kubernetes.io/whitelist-source-range: "203.0.113.7/32"
spec:
  ingressClassName: nginx
  rules:
    # 与 DNS 记录保持一致；yanhuang.ai4s.com.cn（生产）不受影响
    - host: dev-cs-9f2k.yanhuang.ai4s.com.cn
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: dev-pod
                port:
                  number: 8080
# ---------------------------------------------------------------------------
# 备选（集群无 Ingress 控制器时）: NodePort —— 节点 IP 从 Mac 直达时可用
#   1) kubectl delete -f k8s/dev-pod-ingress.yaml  （如已 apply）
#   2) 取消下面注释后 apply:
#      kubectl apply -f k8s/dev-pod-ingress.yaml
#   3) 浏览器打开 http://<节点IP>:<NodePort>/
#
# apiVersion: v1
# kind: Service
# metadata:
#   name: dev-pod
# spec:
#   type: NodePort
#   selector:
#     app: dev-pod
#   ports:
#     - name: code-server
#       port: 8080
#       targetPort: 8080
#       nodePort: 30880

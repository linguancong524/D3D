name: CPU checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install CPU dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch==2.6.0 torchvision==0.21.0 --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt
          pip install -e . --no-deps
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Python and shell syntax
        run: |
          python -m compileall -q single serving models common train pruning
          for script in scripts/*.sh; do bash -n "$script"; done

  training-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-train.txt
      - name: Install CPU training-check dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch==2.8.0 --index-url https://download.pytorch.org/whl/cpu
          pip install transformers==4.57.3 accelerate==1.12.0 safetensors==0.7.0 pandas==2.3.3 pyarrow==22.0.0
          pip install -e . --no-deps
      - name: Training and pruning integration checks
        env:
          CUDA_VISIBLE_DEVICES: ''
        run: python -m unittest discover -s tests -p test_training_release.py -v

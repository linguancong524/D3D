<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="banner-title banner-description">
  <title id="banner-title">D3D — Decoupled Diffusion Drafting</title>
  <desc id="banner-description">A dark blue banner showing diffusion drafting and target verification on two overlapping execution lanes.</desc>
  <defs>
    <linearGradient id="background-gradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1228"/>
      <stop offset="1" stop-color="#172554"/>
    </linearGradient>
    <linearGradient id="draft-gradient" x1="0" x2="1">
      <stop offset="0" stop-color="#818cf8"/>
      <stop offset="1" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="verify-gradient" x1="0" x2="1">
      <stop offset="0" stop-color="#2dd4bf"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <pattern id="background-grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#a5b4fc" stroke-opacity="0.055"/>
    </pattern>
  </defs>
  <rect width="1200" height="360" rx="24" fill="url(#background-gradient)"/>
  <rect width="1200" height="360" rx="24" fill="url(#background-grid)"/>
  <circle cx="1070" cy="36" r="174" fill="#6366f1" opacity="0.07"/>
  <circle cx="1120" cy="318" r="130" fill="#22d3ee" opacity="0.06"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <rect x="52" y="42" width="160" height="28" rx="14" fill="#818cf8" fill-opacity="0.12" stroke="#818cf8" stroke-opacity="0.3"/>
    <text x="132" y="61" fill="#c7d2fe" font-size="11" font-weight="700" text-anchor="middle" letter-spacing="1.5">DRAFT · VERIFY · OVERLAP</text>
    <text x="49" y="181" fill="#f8fafc" font-size="106" font-weight="800" letter-spacing="-5">D3D</text>
    <text x="54" y="222" fill="#c7d2fe" font-size="22" font-weight="600">Decoupled Diffusion Drafting</text>
    <text x="54" y="252" fill="#94a3b8" font-size="16">A decoupled architecture for asynchronous decoding</text>
    <rect x="54" y="286" width="112" height="28" rx="7" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.1"/>
    <text x="110" y="305" fill="#cbd5e1" font-size="12" text-anchor="middle">Two-GPU execution</text>
    <rect x="176" y="286" width="131" height="28" rx="7" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.1"/>
    <text x="241" y="305" fill="#cbd5e1" font-size="12" text-anchor="middle">Single &amp; concurrent</text>
    <g transform="translate(560 66)">
      <rect width="578" height="246" rx="18" fill="#020617" fill-opacity="0.4" stroke="#64748b" stroke-opacity="0.26"/>
      <text x="26" y="33" fill="#e2e8f0" font-size="15" font-weight="600">Independent models. Overlapping work.</text>
      <text x="26" y="72" fill="#a5b4fc" font-size="12">GPU 1 · D3D DIFFUSION DRAFT</text>
      <text x="26" y="164" fill="#5eead4" font-size="12">GPU 0 · TARGET VERIFIER</text>
      <g fill="url(#draft-gradient)">
        <rect x="26" y="86" width="120" height="34" rx="7"/>
        <rect x="156" y="86" width="120" height="34" rx="7" opacity="0.85"/>
        <rect x="286" y="86" width="120" height="34" rx="7" opacity="0.7"/>
        <rect x="416" y="86" width="136" height="34" rx="7" opacity="0.55"/>
      </g>
      <g fill="url(#verify-gradient)">
        <rect x="88" y="178" width="120" height="34" rx="7"/>
        <rect x="218" y="178" width="120" height="34" rx="7" opacity="0.85"/>
        <rect x="348" y="178" width="120" height="34" rx="7" opacity="0.7"/>
        <rect x="478" y="178" width="74" height="34" rx="7" opacity="0.55"/>
      </g>
      <g stroke="#94a3b8" stroke-opacity="0.65" fill="none" stroke-dasharray="4 5">
        <path d="M146 123V139H208V175"/>
        <path d="M276 123V139H338V175"/>
        <path d="M406 123V139H468V175"/>
      </g>
      <g fill="#0f172a" font-size="12" font-weight="700" text-anchor="middle">
        <text x="86" y="108">Draft block</text>
        <text x="216" y="108">Draft block</text>
        <text x="346" y="108">Draft block</text>
        <text x="484" y="108">Draft block</text>
        <text x="148" y="200">Verify</text>
        <text x="278" y="200">Verify</text>
        <text x="408" y="200">Verify</text>
        <text x="515" y="200">Verify</text>
      </g>
    </g>
  </g>
</svg>
